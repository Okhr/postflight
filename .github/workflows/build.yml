name: build

# Every commit on master, plus a manual button. The images are what gets deployed,
# so they are built from the same Dockerfile the machines run, never from a variant.
on:
  push:
    branches: [master]
  workflow_dispatch:

# A second push while the first is still building makes the first one pointless:
# only the head of master ever gets deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lowercase and hardcoded on purpose: `github.repository` is `Okhr/video-stab`,
  # and GHCR rejects an uppercase letter in an image name.
  IMAGE: ghcr.io/okhr/video-stab

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 3.13 because that is what ubuntu:25.04 ships and therefore what the image
      # runs. Testing on anything else would test something we do not deploy.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pytest
        run: pytest -q
        working-directory: backend

  images:
    name: images
    # The images are only worth building if the frame arithmetic, the split
    # detection, the ingestion rules and the capability probing still hold.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two images, one Dockerfile, two targets. Built in one job and in this order
      # so the second build reuses the `base` and `frontend` stages the first one just
      # produced, from the same builder instance. A matrix would run them in parallel
      # and build the shared stages twice.
      - id: meta_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-api
          # `latest` for deployments, the sha for pinning one and for rolling back.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          # amd64 only, and not by omission: Gyroflow and mp4_merge are shipped as
          # prebuilt linux64 binaries, so there is no arm64 image to be had.
          platforms: linux/amd64
          # Without this, buildx pushes a manifest list with an extra
          # unknown/unknown attestation entry, which some registries and some
          # Portainer versions display as a second broken architecture.
          provenance: false
          # The apt layer and the Gyroflow download dominate the build; caching them
          # turns a 10 minute job into about 2. One scope for both images, since they
          # share every layer up to `base`.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta_worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images poussées"
            echo
            echo '```'
            echo "${{ steps.meta_api.outputs.tags }}"
            echo "${{ steps.meta_worker.outputs.tags }}"
            echo '```'
            echo
            echo "Déploiement, dans le \`.env\` :"
            echo
            echo '```'
            echo "VS_IMAGE_API=${{ env.IMAGE }}-api:latest"
            echo "VS_IMAGE_WORKER=${{ env.IMAGE }}-worker:latest"
            echo '```'
            echo
            echo "puis \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
