<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- What the app does, in one stroke: a shaky line that comes out flat. Black and
       white, and drawn thick, because the mark is read at 16 px: a thinner stroke went
       faint and a second bump turned to mush. -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <path d="M4.5 16 q3 -9 6 0 t6 0 h11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
