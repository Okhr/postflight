# One extra worker, on a machine that is not the dispatcher's.
#
# Standalone: this file is the whole deployment for a machine that lends its CPU and
# GPU to a dispatcher running elsewhere. There is nothing to open here and nothing to
# discover. The worker dials out to `VS_API_URL`, announces itself, and asks for work;
# the dispatcher never calls back.
#
#   VS_API_URL=http://192.168.1.104:8080 VS_WORKER_NAME=desktop \
#     docker compose -f docker-compose.remote-worker.yml up -d
#
# The volume here is a **work volume**, not the dispatcher's. It holds only what this
# machine needed for the jobs it ran: inputs fetched over HTTP, outputs on their way
# back, and a cache of both so a second cut of the same sequence does not fetch the
# master again. Size it to a handful of masters and set VS_WORKER_CACHE_BYTES a little
# under that; the worker deletes its oldest footage to stay inside it.
#
# For a GPU, add the same override the main stack uses:
#   -f docker-compose.remote-worker.yml -f docker-compose.nvidia.yml    (NVIDIA)
#   -f docker-compose.remote-worker.yml -f docker-compose.gpu.yml       (AMD/Intel)

services:
  worker:
    image: ${VS_IMAGE_WORKER:-ghcr.io/okhr/video-stab-worker:latest}
    command: ["worker"]
    restart: unless-stopped
    # Docker's default is 10s, then SIGKILL. A render runs for minutes, and an ffmpeg
    # killed mid-decode has left this project's AMD hardware deadlocked on an orphaned
    # VAAPI fence, machine reboot only. The worker forwards SIGTERM to its child and
    # waits; this gives it the room to.
    stop_grace_period: 60s
    user: "${VS_UID:-1000}:${VS_GID:-1000}"
    volumes:
      - ${VS_WORK_PATH:-./work}:/data
    environment:
      VS_DATA_DIR: /data
      # Required: where the dispatcher is. No default, because a wrong one would show
      # up as a worker that silently never registers.
      VS_API_URL: ${VS_API_URL:?set VS_API_URL to the dispatcher, e.g. http://192.168.1.104:8080}
      # Required too, and it has to be stable: a name is what ties a worker's history
      # to its machine, including everything real jobs have measured about its speed.
      VS_WORKER_NAME: ${VS_WORKER_NAME:?set VS_WORKER_NAME to something stable for this machine}
      # Set this, on both sides, as soon as the dispatcher is reachable by anything
      # other than a private network. It guards the file endpoints too, which serve any
      # footage on the volume and accept writes into the directories the pipeline
      # produces. Empty leaves them open, which is fine on a LAN and only there.
      VS_WORKER_TOKEN: ${VS_WORKER_TOKEN:-}
      # How much footage this machine may keep. It evicts its oldest to stay under.
      VS_WORKER_CACHE_BYTES: ${VS_WORKER_CACHE_BYTES:-20000000000}
      VS_HWACCEL: ${VS_HWACCEL:-auto}
      VS_PROXY_HEIGHT: ${VS_PROXY_HEIGHT:-960}
      VS_PROXY_CRF: ${VS_PROXY_CRF:-26}
