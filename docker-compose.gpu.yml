# Override to apply when the host has an **AMD or Intel** GPU.
#
# Those two are reached by mapping the DRM render node, and the image carries their
# drivers (Mesa radeonsi / rusticl, Intel iHD / NEO). An NVIDIA card works nothing
# like this; see docker-compose.nvidia.yml.
#
# Measured on a 1080p render from a 3840x2880 source, on a Radeon 890M:
#   with /dev/dri (OpenCL rusticl): 23 fps
#   on the CPU alone (pocl)        : ~8.7 fps
#
# `group_add` must hold the GID of the host's `render` group (`getent group
# render`). It varies between distributions (991 on Ubuntu 25.04, 44 or 104
# elsewhere). Put PF_RENDER_GID in the .env.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Note: mapping /dev/dri also enables VAAPI decoding, which has been seen to wedge
# the amdgpu driver on 3840x2880 HEVC 10-bit. Keep PF_HWACCEL=cpu on that hardware.
# OpenCL, the reason to map the GPU in the first place, is unaffected.

# Only the worker: the API image has no Mesa driver to use the render node with.
services:
  worker:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${PF_RENDER_GID:-991}"
